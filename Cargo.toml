[package]
name = "omnifetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A blazing-fast, lightweight system info fetch tool written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/byindex/omnifetch"
homepage = "https://github.com/byindex/omnifetch"
documentation = "https://github.com/byindex/omnifetch#readme"
keywords = ["fetch", "system-info", "neofetch", "fastfetch", "cli"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2.189"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
